name : Premier workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Récuperer le depôt 
        uses: actions/checkout@v4

      - name: Executer un script 
        run: bash .github/scripts/hello.sh

      - name: Terminé
        run: echo "Le workflow est terminé"